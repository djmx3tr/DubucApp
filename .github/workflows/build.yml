name: Build APK

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        timeout-minutes: 10
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true
          cache-key: flutter-${{ runner.os }}-3.19.0

      - name: Generate Android project and configure
        run: |
          # Créer le projet Flutter dans un répertoire temporaire
          flutter create --org com.dubuc --project-name dubuc_app temp_app
          
          # Copier nos fichiers dans le projet généré
          cp -r lib/* temp_app/lib/
          cp pubspec.yaml temp_app/
          
          # Déplacer le projet généré à la racine
          rm -rf android
          mv temp_app/android .
          mv temp_app/pubspec.yaml .
          rm -rf temp_app

          # === 1. Fix minSdkVersion (requis par mobile_scanner et permissions) ===
          sed -i 's/minSdk = .*/minSdk = 21/' android/app/build.gradle
          sed -i 's/minSdkVersion .*/minSdkVersion 21/' android/app/build.gradle

          # === 2. Fix Kotlin conflicts dans app/build.gradle ===
          cat >> android/app/build.gradle << 'EOF'

          configurations.all {
              resolutionStrategy.eachDependency { details ->
                  if (details.requested.group == 'org.jetbrains.kotlin') {
                      details.useVersion '1.8.22'
                  }
              }
          }
          EOF

          # === 3. Fix AndroidX compatibility ===
          sed -i 's/androidx.core:core-ktx:.*/androidx.core:core-ktx:1.12.0/' android/app/build.gradle
          sed -i 's/com.google.android.material:material:.*/com.google.android.material:material:1.11.0/' android/app/build.gradle

          # === 4. Permissions et config AndroidManifest ===
          cat > android/app/src/main/AndroidManifest.xml << 'MANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <!-- Permissions pour les notifications et réseau -->
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              
              <!-- Permissions pour la caméra (scanner) -->
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              
              <uses-feature android:name="android.hardware.camera" android:required="true" />
              <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />
              
              <application
                  android:label="Dubuc & CO"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">
                  
                  <!-- Configuration pour les notifications (Android 13+) -->
                  <service
                      android:name="androidx.work.impl.foreground.SystemForegroundService"
                      android:foregroundServiceType="dataSync" />
                  
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          MANIFEST

          echo "=== Configuration Android terminée ==="
          
      - name: Get dependencies
        run: |
          echo "=== Installation des dépendances ==="
          flutter pub get
          echo "=== Vérification des dépendances ==="
          flutter doctor -v
          echo "=== Dépendances installées avec succès ==="

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Build APK (Debug)  
        run: flutter build apk --debug

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
