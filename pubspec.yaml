name: dubuc_app
description: Application de gestion des jobs Dubuc & CO
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.1.0
  mobile_scanner: ^3.5.5
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  intl: ^0.18.1
  
  # WebSocket pour notifications push
  web_socket_channel: ^3.0.1
  
  # Notifications locales Android
  flutter_local_notifications: ^18.0.1
  
  # Base de données locale pour historique
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.1
  
  # Service en arrière-plan
  flutter_background_service: ^5.0.12
  flutter_background_service_android: ^6.2.7
  
  # Permissions
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
